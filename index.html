<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picochat</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         font: 15px/1.45 system-ui, -apple-system, sans-serif; background: #f6f7f9; color: #1c2430; }
  main { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 980px;
         margin: 0 auto; padding: 20px 20px 12px; gap: 14px; }
  #cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
  #cfg label { font-weight: 600; font-size: 14px; display: flex; column-gap: 6px; }
  input { font: inherit; padding: 9px 12px; border: 1px solid #d4dae3; border-radius: 10px;
          background: #eef1f6; outline: none; min-width: 0; }
  input:focus { border-color: #8aa4c8; background: #fff; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #dce8f8; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e2e7ee; }
  .msg.error { align-self: center; background: #fde8e8; color: #9b1c1c; font-size: 13px;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  form { display: flex; gap: 8px; }
  #prompt { flex: 1; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border: none; border-radius: 10px;
           background: #35599b; color: #fff; cursor: pointer; }
  button:hover { background: #2b4a82; }
  button:disabled { opacity: .5; cursor: default; }
  #reset { background: #e3e8f0; color: #33415a; }
  #reset:hover { background: #d4dbe8; }
  @media (max-width: 700px) { #cfg { grid-template-columns: 1fr; } .msg { max-width: 90%; } }
</style>
</head>
<body>
<main>
  <section id="cfg">
    <label>Base URL<input id="base" list="hist-base" placeholder="eg: https://proxy.openai.com/v1" autocomplete="off" spellcheck="false"><datalist id="hist-base"></datalist></label>
    <label>API Key<input id="key" type="password" list="hist-key" placeholder="Generic service API Key" autocomplete="off"><datalist id="hist-key"></datalist></label>
    <label>Selected Model<input id="model" list="hist-model" placeholder="Model id used for chat requests" spellcheck="false"><datalist id="hist-model"></datalist></label>
    <label>Model context window<input id="ctx" type="number" min="1" list="hist-ctx" placeholder="Content window limit (eg: 4096)"><datalist id="hist-ctx"></datalist></label>
    <label>Max Tokens<input id="max" type="number" min="1" list="hist-max" placeholder="Max tokens per request (eg: 1024)"><datalist id="hist-max"></datalist></label>
  </section>
  <section id="chat" aria-live="polite"></section>
  <form id="send">
    <input id="prompt" placeholder="Send a message…" autocomplete="off">
    <button id="go" type="submit">Send</button>
    <button id="reset" type="button" title="Clear conversation">Reset</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const cfgEls = { base: $('base'), key: $('key'), model: $('model'), ctx: $('ctx'), max: $('max') };
const chat = $('chat'), prompt = $('prompt'), go = $('go');
const STORE = 'picochat.cfg.v1';
const HIST = 'picochat.hist.v1';

// ---- settings: persisted to localStorage, sent fresh with every request ----
let hist;   // {base: [...], key: [...], ...} — recent values per field, newest first
try {
  hist = JSON.parse(localStorage.getItem(HIST) || 'null') || {};
  for (const k in cfgEls) if (!Array.isArray(hist[k])) hist[k] = [];
} catch { hist = {}; }

function renderList(k) {
  const el = $('hist-' + k);
  el.innerHTML = '';
  for (const v of hist[k]) {
    const o = document.createElement('option');
    o.value = v;
    el.appendChild(o);
  }
}

// Record the final value of a field on commit (Enter, blur, or send) —
// not on every keystroke, so partial typing doesn't pollute the history.
function remember(k) {
  const v = cfgEls[k].value.trim();
  if (!v) return;
  hist[k] = [v, ...hist[k].filter(x => x !== v)].slice(0, 10);
  localStorage.setItem(HIST, JSON.stringify(hist));
  renderList(k);
}

try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null') || {};
  for (const k in cfgEls) {
    if (saved[k] != null) cfgEls[k].value = saved[k];
    remember(k); // seed history with restored values
  }
} catch {}
for (const k in cfgEls) {
  cfgEls[k].addEventListener('input', () => {
    const o = {};
    for (const f in cfgEls) o[f] = cfgEls[f].value;
    localStorage.setItem(STORE, JSON.stringify(o));
  });
  cfgEls[k].addEventListener('change', () => remember(k));
  cfgEls[k].addEventListener('blur', () => remember(k));
  cfgEls[k].addEventListener('keydown', e => { if (e.key === 'Enter') remember(k); });
  renderList(k);
}

// ---- chat state: stateless API, so the full history is re-sent each request ----
let msgs = [];   // [{role, content}]
let busy = false;

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function scroll() { chat.scrollTop = chat.scrollHeight; }

$('reset').onclick = () => { if (!busy) { msgs = []; chat.innerHTML = ''; } };

// Heuristic token estimate (~4 chars/token, +4 tokens/message overhead) used to
// fit history into the configured context window. Drops oldest messages first,
// keeps at least the newest one, reserves room for max_tokens.
const estTok = m => 4 + Math.ceil(m.content.length / 4);
function fit(history, ctx, max) {
  if (!ctx) return history;
  const budget = ctx - (max || 0);
  const out = history.slice();
  let used = out.reduce((s, m) => s + estTok(m), 0);
  while (out.length > 1 && used > budget) { used -= estTok(out[0]); out.shift(); }
  return out;
}

// Reads an SSE stream: returns the full content, calling onDelta(full) per token.
// Throws a descriptive error if the stream is malformed.
async function streamSSE(res, onDelta) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', full = '', seen = 0, dataLines = 0, head = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = dec.decode(value, { stream: true });
    if (!head) head = chunk;
    seen += value.byteLength;
    buf += chunk;
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') return full;
      dataLines++;
      let delta;
      try {
        delta = JSON.parse(data).choices?.[0]?.delta?.content;
      } catch {
        throw new Error(`malformed SSE after ${seen} bytes / ${dataLines} data lines: ${data.slice(0, 120)}`);
      }
      if (delta) { full += delta; onDelta(full); }
    }
  }
  if (!full) {
    throw new Error(
      `no content received (stream ended: ${seen} bytes, ${dataLines} data line${dataLines === 1 ? '' : 's'})` +
      ` — response head: ${head.replace(/\s+/g, ' ').slice(0, 160) || '(empty body)'}`
    );
  }
  return full;
}

$('send').addEventListener('submit', async e => {
  e.preventDefault();
  const text = prompt.value.trim();
  if (busy || !text) return;
  const base = cfgEls.base.value.trim().replace(/\/+$/, '');
  const key = cfgEls.key.value.trim();
  const model = cfgEls.model.value.trim();
  const ctx = +cfgEls.ctx.value || 0;
  const max = +cfgEls.max.value || 0;
  if (!base || !key || !model) { addMsg('error', 'Base URL, API Key and Model are required.'); return; }

  const url = base + '/chat/completions';

  busy = true; go.disabled = true;
  msgs.push({ role: 'user', content: text });
  const sent = fit(msgs, ctx, max);
  const body = { model, messages: sent, ...(max ? { max_tokens: max } : {}), stream: true };
  addMsg('user', text);
  prompt.value = '';
  const bubble = addMsg('assistant', '');

  // Diagnostics kept for the failure bubble (never includes the full API key).
  const dbg = {
    url,
    model,
    history: msgs.length, sent: sent.length,
    ctxWindow: ctx || null, maxTokens: max || null,
    keyPrefix: key.length > 12 ? key.slice(0, 8) + '…' + key.slice(-4) : '(short key)',
  };
  console.log('[picochat] → POST', url, { ...dbg });

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 400); } catch {}
      dbg.status = res.status; dbg.statusText = res.statusText; dbg.contentType = res.headers.get('content-type');
      console.error('[picochat] ← HTTP', res.status, res.statusText, detail);
      throw new Error(`HTTP ${res.status} ${res.statusText}${detail ? ' — ' + detail : ''}`);
    }
    dbg.status = res.status; dbg.contentType = res.headers.get('content-type');
    console.log('[picochat] ←', res.status, res.statusText, 'streaming');
    const full = await streamSSE(res, t => { bubble.textContent = t; scroll(); });
    bubble.textContent = full || '(empty response)';
    msgs.push({ role: 'assistant', content: full });
  } catch (err) {
    // Keep the user message in msgs so the next send retries it.
    bubble.remove();
    const lines = ['Request failed: ' + ((err && err.message) || String(err))];
    lines.push(
      `→ POST ${dbg.url}`,
      `  model: ${dbg.model}`,
      `  history: ${dbg.history} msg${dbg.history === 1 ? '' : 's'} → sent: ${dbg.sent}`,
      `  context window: ${dbg.ctxWindow}, max_tokens: ${dbg.maxTokens}`,
      `  api key: ${dbg.keyPrefix}`,
    );
    if (dbg.status != null) lines.push(`← HTTP ${dbg.status} ${dbg.statusText}${dbg.contentType ? ' (' + dbg.contentType + ')' : ''}`);
    if (err instanceof TypeError) lines.push('(fetch never resolved — usually network/CORS/DNS/TLS; check the base URL)');
    console.error('[picochat] request failed', (err && err.stack) || String(err), dbg);
    addMsg('error', lines.join('\n'));
  } finally {
    busy = false; go.disabled = false;
  }
});
</script>
</body>
</html>
